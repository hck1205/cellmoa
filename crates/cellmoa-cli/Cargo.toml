[package]
name = "cellmoa-cli"
description = "Command-line interface to the cellmoa spreadsheet engine"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "cellmoa"
path = "src/main.rs"

[dependencies]
cellmoa-core.workspace = true
cellmoa-engine.workspace = true
cellmoa-xlsx.workspace = true
cellmoa-diff.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
cellmoa-xlsx.workspace = true

[[example]]
name = "make_budget"
path = "examples/make_budget.rs"
