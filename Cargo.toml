[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hck1205/cellmoa"

[workspace.dependencies]
cellmoa-core = { path = "crates/cellmoa-core", version = "0.1.0" }
cellmoa-formula = { path = "crates/cellmoa-formula", version = "0.1.0" }
cellmoa-engine = { path = "crates/cellmoa-engine", version = "0.1.0" }
cellmoa-xlsx = { path = "crates/cellmoa-xlsx", version = "0.1.0" }
cellmoa-diff = { path = "crates/cellmoa-diff", version = "0.1.0" }
cellmoa-api = { path = "crates/cellmoa-api", version = "0.1.0" }
serde = { version = "1", features = ["derive"] }
# preserve_order keeps JSON fields in the order they were written rather than
# sorting them. The order is part of what the output means: `--select
# 'Status,Amount'` asks for an order, and a summary belongs above the rows it
# summarises.
serde_json = { version = "1", features = ["preserve_order"] }
